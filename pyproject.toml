[project]
name = "paratranz-py"
version = "0.7.3"
description = "A simple ParaTranz Python Package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "idna==3.17",
    "loguru==0.7.3",
    "pooch==1.9.0",
    "requests==2.34.2",
    "urllib3==2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff==0.15.15",
]
